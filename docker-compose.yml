services:
  stayspot-db:
    image: mysql:8.0
    container_name: stayspot-db
    environment:
      MYSQL_DATABASE: stayspot_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - ./backend/MYSQL_SETUP.sql:/docker-entrypoint-initdb.d/setup.sql
    networks:
      - stayspot-network

  stayspot-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: stayspot-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://stayspot-db:3306/stayspot_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      JWT_SECRET: MySecretKeyForStaySpotApplicationWithMinimum256BitsLengthForHS256Algorithm
    depends_on:
      - stayspot-db
    networks:
      - stayspot-network

  stayspot-frontend:
    build:
      context: ./frontend
      dockerfile: ../frontend.Dockerfile
    container_name: stayspot-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    networks:
      - stayspot-network

networks:
  stayspot-network:
    driver: bridge

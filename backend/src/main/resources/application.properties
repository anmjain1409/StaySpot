# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/stayspot_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=AnshJain29@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=MySecretKeyForStaySpotApplicationWithMinimum256BitsLengthForHS256Algorithm
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.stayspot=DEBUG

# Application Name
spring.application.name=StaySpot

# Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
